<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento de imposto de renda · Aurea Financial</title>
<meta name="description" content="Peça o orçamento da sua declaração de imposto de renda nos EUA. Responda algumas perguntas e receba o orçamento por e-mail.">
<meta property="og:title" content="Orçamento de imposto de renda · Aurea Financial">
<meta property="og:description" content="Responda algumas perguntas rápidas e receba o orçamento da sua declaração por e-mail.">
<meta property="og:image" content="https://aureafi.com/img/svc2.jpg">
<meta property="og:url" content="https://aureafi.com/orcamento-impostos">
<link rel="canonical" href="https://aureafi.com/orcamento-impostos">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .orc-wrap{padding:48px 0 96px}
  .orc-card{max-width:760px;margin:0 auto;background:var(--cream-2);border:1px solid var(--line);box-shadow:0 18px 50px rgba(19,31,28,.08);padding:44px 48px 40px}
  .orc-intro h1,.orc-q{font-weight:800;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.15;letter-spacing:-.02em;outline:none}
  .orc-intro .eyebrow{color:var(--brown);margin-bottom:18px}
  .orc-intro .lead{margin-top:16px;font-size:18px;line-height:1.6;color:#4a4a44}
  .orc-pontos{margin:22px 0 30px;padding:0;list-style:none}
  .orc-pontos li{position:relative;padding-left:28px;margin:10px 0;color:#3b3b36}
  .orc-pontos li::before{content:"";position:absolute;left:2px;top:.45em;width:12px;height:7px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
  .orc-top{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brown)}
  .orc-pos{color:#8a8172;font-weight:600;letter-spacing:.02em;text-transform:none}
  .orc-bar{display:flex;gap:6px;margin:12px 0 30px}
  .orc-bar span{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .orc-bar i{display:block;height:100%;background:var(--gold);transition:width .35s ease}
  .orc-step{padding:0 !important;margin:0 !important;border:0 !important;background:none !important;box-shadow:none !important;max-width:none !important}
  .orc-ajuda{margin-top:10px;color:#5b574f;font-size:16px}
  .orc-step > .orc-input,.orc-step > .orc-tel,.orc-step > .orc-ops,.orc-step > .orc-nums,.orc-step > .orc-pair:first-of-type,.orc-step > .orc-chips,.orc-step > .orc-info,.orc-step > .orc-check:first-of-type,.orc-step > .orc-lbl:first-of-type{margin-top:26px}
  .orc-input{display:block;width:100%;font:500 17px var(--sans);padding:15px 16px;border:1px solid #cfc2ae;background:#fff;color:var(--ink);border-radius:0}
  .orc-input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
  textarea.orc-input{resize:vertical;min-height:130px}
  .orc-lbl{display:block;font-weight:700;font-size:14px;margin:18px 0 8px}
  .orc-tel{display:flex;gap:8px}
  .orc-pais{position:relative;flex:none;width:104px}
  .orc-pais-v{display:flex;align-items:center;gap:8px;height:100%;padding:0 12px;border:1px solid #cfc2ae;background:#fff;font:600 16px var(--sans);color:var(--ink);pointer-events:none}
  .orc-pais-v .flag{width:24px;height:16px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .orc-pais-v .chev{width:10px;height:6px;margin-left:auto;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .orc-tel .orc-input{margin:0 !important}
  .orc-pais-v .chev{flex:none}
  .orc-pais select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  .orc-pais:focus-within .orc-pais-v{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
  .orc-ops{display:grid;gap:10px}
  .orc-ops.col2{grid-template-columns:1fr 1fr}
  .orc-op{display:flex;align-items:center;gap:14px;text-align:left;font:600 16px var(--sans);color:var(--ink);background:#fff;border:1px solid #d9ccb8;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s}
  .orc-op:hover{border-color:var(--gold)}
  .orc-op i{flex:none;width:20px;height:20px;border:2px solid #b9ab94;border-radius:50%;position:relative}
  .orc-op.multi i{border-radius:3px}
  .orc-op[aria-checked="true"]{border-color:var(--ink);background:#fffaf2;box-shadow:inset 0 0 0 1px var(--ink)}
  .orc-op[aria-checked="true"] i{border-color:var(--ink);background:var(--ink)}
  .orc-op[aria-checked="true"] i::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--cream-2);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .orc-nums{display:flex;flex-wrap:wrap;gap:10px}
  .orc-num{min-width:58px;height:58px;font:700 18px var(--sans);background:#fff;border:1px solid #d9ccb8;color:var(--ink);cursor:pointer}
  .orc-num:hover{border-color:var(--gold)}
  .orc-num[aria-checked="true"]{background:var(--ink);color:var(--cream-2);border-color:var(--ink)}
  .orc-pair{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line)}
  .orc-pair > span{font-weight:600;font-size:17px;flex:1 1 260px}
  .orc-yn{display:flex}
  .orc-yn button{font:700 15px var(--sans);padding:12px 22px;background:#fff;border:1px solid #d9ccb8;color:var(--ink);cursor:pointer}
  .orc-yn button + button{border-left:0}
  .orc-yn button[aria-checked="true"]{background:var(--ink);color:var(--cream-2);border-color:var(--ink)}
  .orc-qtd{flex-basis:100%;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .orc-qtd input{width:110px;font:600 16px var(--sans);padding:10px 12px;border:1px solid #cfc2ae}
  .orc-chips{display:flex;flex-wrap:wrap;gap:8px;min-height:0}
  .orc-chips:empty{display:none}
  .orc-chip{font:700 14px var(--sans);background:var(--ink);color:var(--cream-2);border:0;padding:8px 12px;cursor:pointer}
  .orc-chips + .orc-input{margin-top:14px}
  .orc-estados{margin-top:10px;max-height:300px;overflow:auto;border:1px solid #d9ccb8;background:#fff;display:grid;grid-template-columns:1fr 1fr}
  .orc-est{text-align:left;font:500 15px var(--sans);color:var(--ink);background:none;border:0;border-bottom:1px solid #f0e7da;padding:11px 14px;cursor:pointer}
  .orc-est b{display:inline-block;width:30px;color:var(--brown)}
  .orc-est:hover{background:#fbf5ec}
  .orc-est[aria-checked="true"]{background:var(--ink);color:var(--cream-2)}
  .orc-est[aria-checked="true"] b{color:var(--gold)}
  .orc-est[hidden]{display:none}
  .orc-info{font-size:18px;line-height:1.6;color:#3b3b36}
  .orc-check{display:flex;gap:12px;align-items:flex-start;margin:14px 0;font-size:16px;line-height:1.5;cursor:pointer}
  .orc-check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
  .orc-docs{margin-top:22px;padding:14px 16px;background:#f3eadc;border-left:3px solid var(--brown);font-size:15px;line-height:1.5;color:#3b3b36}
  .orc-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .orc-warn{margin-top:20px;padding:14px 16px;background:#fff6e0;border:1px solid #e6cf97;border-left:4px solid var(--gold);font-size:15px;line-height:1.5}
  .orc-err{margin-top:14px;color:#9b2c1f;font-weight:600;font-size:15px;min-height:1px}
  .orc-err:empty{margin:0}
  .orc-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
  .orc-ok{text-align:center}
  .orc-ok svg{width:64px;height:64px;margin:0 auto 18px;display:block;fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .orc-ok .orc-docs{text-align:left;margin-bottom:26px}
  .orc-es{text-align:left;margin:4px 0 26px;padding-top:20px;border-top:1px solid var(--line)}
  .orc-es p{font-size:16px;line-height:1.55;color:#3b3b36;margin:0 0 10px}
  .orc-es .orc-es-t{font-weight:800;font-size:19px;color:var(--ink)}
  .orc-nota{max-width:760px;margin:18px auto 0;font-size:14px;color:#7a7266;text-align:center}
  @media (max-width:700px){
    .orc-wrap{padding:20px 0 64px}
    .orc-card{padding:28px 20px 26px;border-left:0;border-right:0;margin:0 -20px}
    .orc-ops.col2,.orc-estados{grid-template-columns:1fr}
    .orc-nav .btn{flex:1;justify-content:center}
    .orc-intro .btn{width:100%;justify-content:center}
  }
</style>
</head>
<body data-page="impostos">

<div id="site-header"></div>

<main>
  <section class="orc-wrap">
    <div class="wrap">
      <div class="orc-card" id="orc" aria-live="polite">
        <noscript><p>Para pedir o orçamento, ative o JavaScript ou fale com a gente pelo WhatsApp. / To request a quote, enable JavaScript or message us on WhatsApp.</p></noscript>
      </div>
      <p class="orc-nota" data-i18n="orc_nota">As suas respostas são usadas só para preparar o orçamento.</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE_DICT = {
  pt: { page_title:"Orçamento de imposto de renda · Aurea Financial", orc_nota:"As suas respostas são usadas só para preparar o orçamento." },
  en: { page_title:"Tax Return Quote · Aurea Financial", orc_nota:"Your answers are used only to prepare your quote." }
};
</script>
<script src="main.js"></script>
<script src="orcamento.js"></script>
</body>
</html>
